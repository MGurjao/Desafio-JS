<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Número Primo</title>
</head>
<body>
    <h1>Insira o número abaixo</h1>
    <input type="number" id="numero1">
    <button onclick="verificarNumero()">Verificar número</button>
    <div id="resultado"></div>

    <script>
        function verificarNumero() {
            let numero = parseInt(document.getElementById("numero1").value);
            let resultadoDiv = document.getElementById("resultado");

            if (numero <= 1) {
                resultadoDiv.innerText = "Por favor, insira um número maior que 1.";
                return;
            }

            let ehPrimo = true;
            for (let i = 2; i <= Math.sqrt(numero); i++) {
                if (numero % i === 0) {
                    ehPrimo = false;
                    break;
                }
            }

            if (ehPrimo) {
                resultadoDiv.innerText = `${numero} é um número primo.`;
            } else {
                resultadoDiv.innerText = `${numero} não é um número primo.`;
            }
        }
    </script>
</body>
</html>
